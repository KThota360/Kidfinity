<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Cache Control Meta Tags -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Kidfinity Chore Tracker</title>
  
  <!-- External Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --accent-green: #10b981;
      --accent-red: #ef4444;
      --accent-blue: #3b82f6;
      --accent-gold: #f59e0b;
      --parent-dark: #0f172a;
      --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
      background-size: 24px 24px;
      color: var(--text);
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    #app-container {
      background: var(--card-bg);
      width: 100%;
      max-width: 580px;
      border-radius: 24px;
      box-shadow: var(--shadow-md);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border: 1px solid rgba(226, 232, 240, 0.8);
      margin: auto;
    }
    .header {
      text-align: center;
      padding: 24px 20px 16px 20px;
      background: #ffffff;
      border-bottom: 1px solid var(--border);
    }
    .header h1 {
      margin: 0 0 16px 0;
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: inline-block;
      text-decoration: none;
    }
    .header a {
      text-decoration: none;
    }
    .tabs {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .tab-btn {
      padding: 8px 16px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: #ffffff;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.9rem;
      color: var(--text-muted);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .tab-btn.active {
      background: #eff6ff;
      color: var(--accent-blue);
      border-color: #bfdbfe;
    }
    .tab-btn.parent-tab {
      background: var(--parent-dark);
      color: white;
      border-color: var(--parent-dark);
    }
    #alert-box {
      display: none;
      padding: 12px 16px;
      margin: 16px 20px 0 20px;
      border-radius: 14px;
      font-weight: 700;
      font-size: 0.9rem;
      text-align: center;
    }
    #alert-box.success { background-color: #d1fae5; color: #065f46; border: 1px solid #a7f3d0; }
    #alert-box.error { background-color: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
    #alert-box.info { background-color: #e0f2fe; color: #075985; border: 1px solid #bae6fd; }
    #content { padding: 20px; flex: 1; }
    
    .score-banner {
      background: #ffffff;
      border: 2px solid var(--border);
      border-radius: 20px;
      padding: 18px;
      margin-bottom: 20px;
      text-align: center;
    }
    .stats-row { display: flex; justify-content: space-around; margin-top: 12px; gap: 8px; }
    .stat-box { text-align: center; background: #f8fafc; padding: 10px 12px; border-radius: 14px; flex: 1; border: 1px solid var(--border); }
    .stat-value { font-size: 1.35rem; font-weight: 800; }
    .stat-label { font-size: 0.725rem; color: var(--text-muted); font-weight: 700; text-transform: uppercase; margin-top: 2px; }
    
    .xp-bar-container {
      margin-top: 14px;
      background: #e2e8f0;
      border-radius: 10px;
      height: 12px;
      overflow: hidden;
      position: relative;
    }
    .xp-bar-fill {
      background: linear-gradient(90deg, #10b981, #3b82f6);
      height: 100%;
      width: 0%;
      transition: width 0.4s ease;
    }
    
    .kid-subtabs { display: flex; margin-bottom: 18px; background: #f1f5f9; padding: 4px; border-radius: 14px; }
    .kid-subtabs button { flex: 1; background: none; border: none; padding: 10px; font-weight: 700; font-size: 0.9rem; color: var(--text-muted); cursor: pointer; border-radius: 10px; }
    .kid-subtabs button.active { background: #ffffff; color: var(--accent-blue); }
    .section-title { font-size: 0.8rem; font-weight: 800; color: var(--text-muted); margin: 22px 0 12px 0; letter-spacing: 1px; text-transform: uppercase; }
    
    .card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px 16px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-left: 5px solid var(--accent-green);
    }
    .card.penalty-card { border-left-color: var(--accent-red); }
    .chore-info { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 0.95rem; flex: 1; }
    .pts-badge {
      font-size: 0.8rem; font-weight: 800; padding: 3px 8px; border-radius: 20px;
      background: #ecfdf5; color: var(--accent-green); border: 1px solid #a7f3d0;
    }
    .pts-badge.penalty { background: #fef2f2; color: var(--accent-red); border-color: #fca5a5; }
    
    .btn { padding: 12px 18px; border: none; border-radius: 12px; font-weight: 700; cursor: pointer; font-size: 0.95rem; transition: background 0.15s ease; }
    .btn-primary { background: var(--accent-blue); color: white; }
    .btn-primary:hover { opacity: 0.9; }
    .btn-secondary { background: #e2e8f0; color: var(--text); }
    .btn-secondary:hover { background: #cbd5e1; }
    .btn-danger { background: var(--accent-red); color: white; }
    .btn-danger:hover { opacity: 0.9; }
    
    input, select, textarea {
      width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 12px;
      margin-bottom: 10px; box-sizing: border-box; font-family: inherit; font-size: 0.95rem; background-color: #f8fafc;
    }
    .task-pill { display: inline-block; background: #f1f5f9; color: #334155; padding: 4px 8px; border-radius: 8px; font-size: 0.825rem; font-weight: 600; margin: 3px 3px 0 0; border: 1px solid #cbd5e1; }
    
    .switch { position: relative; display: inline-block; width: 50px; height: 28px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #cbd5e1; transition: .25s; border-radius: 34px; }
    .slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 4px; bottom: 4px; background-color: white; transition: .25s; border-radius: 50%; }
    input:checked + .slider { background-color: var(--accent-green); }
    input:checked + .slider.penalty { background-color: var(--accent-red); }
    input:checked + .slider:before { transform: translateX(22px); }
  </style>
</head>
<body>
<div id="app-container">
  <div class="header">
    <a href="#"><h1>🏰 Kidfinity</h1></a>
    <div class="tabs" id="tabs-container"></div>
  </div>
  <div id="alert-box"></div>
  <div id="content">Loading database...</div>
</div>

<script>
  // --- DATABASE SETUP ---
  const SUPABASE_URL = "https://iviohybtosmtvzousqqq.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml2aW9oeWJ0b3NtdHZ6b3VzcXFxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI5NDYxOTAsImV4cCI6MjA5ODUyMjE5MH0.0LV25LS-6Yv3EF6_Td5uv-o4Jgm7qNstDSs3RHFRWeo";
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const PARENT_PIN = "20579";
  
  // App variables
  let kids = [], chores = [], logs = [], redemptions = [];
  let selectedKidId = 'parents';
  let parentUnlocked = false;
  let kidViewMode = 'today'; 
  let parentManageTab = null;
  let editingChoreId = null; 
  let editingPendingId = null; // Stores ID of the pending log currently being edited by parent
  
  const kidColors = ["#ec4899", "#8b5cf6", "#14b8a6", "#f59e0b"];
  let selectedTaskDate = getLocalTodayISO();
  let alertTimer = null;

  // Global settings synced dynamically with localStorage
  function getRedeemThreshold() {
    return parseInt(localStorage.getItem("redeem_threshold") || "500", 10);
  }
  function getExchangeRate() {
    return parseInt(localStorage.getItem("exchange_rate") || "100", 10);
  }

  // --- HELPER FUNCTIONS FOR DATE & TIMEZONE ---
  function getLocalTodayISO() {
    const d = new Date();
    const year = d.getFullYear();
    const month = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${year}-${month}-${day}`;
  }
  function parseLocalDate(dateStr) {
    if (!dateStr) return new Date();
    if (typeof dateStr === 'string' && dateStr.length === 10 && dateStr.includes('-')) {
      const [y, m, d] = dateStr.split('-').map(Number);
      return new Date(y, m - 1, d);
    }
    return new Date(dateStr);
  }
  function formatDate(dateVal) {
    if (!dateVal) return '';
    const dateObj = parseLocalDate(dateVal);
    return dateObj.toLocaleDateString([], { month: 'short', day: 'numeric' });
  }
  function showAlert(msg, type = 'info') {
    const alertBox = document.getElementById("alert-box");
    if (!alertBox) return;
    alertBox.className = type;
    alertBox.innerHTML = msg;
    alertBox.style.display = "block";
    clearTimeout(alertTimer);
    alertTimer = setTimeout(() => { alertBox.style.display = "none"; }, 4000);
  }

  window.onload = loadData;

  // --- SAFE & DETAILED DATABASE LOAD ---
  async function loadData() {
    try {
      if (sessionStorage.getItem("parentUnlocked") === "true") {
        parentUnlocked = true;
      }
      
      // Step 1: Fetch Kids
      const { data: kData, error: kErr } = await supabaseClient.from("kids").select("*").order("id");
      if (kErr) throw new Error("Could not load kids. Check 'kids' table: " + kErr.message);
      kids = kData || [];

      // Step 2: Fetch Chores
      const { data: cData, error: cErr } = await supabaseClient.from("chores").select("*").order("id");
      if (cErr) throw new Error("Could not load chores. Check 'chores' table: " + cErr.message);
      chores = cData || [];

      // Step 3: Fetch Task Logs
      const { data: lData, error: lErr } = await supabaseClient.from("task_logs").select("*").order("id", { ascending: false });
      if (lErr) throw new Error("Could not load task logs. Check 'task_logs' table: " + lErr.message);
      logs = lData || [];

      // Step 4: Fetch Redemptions
      const { data: rData, error: rErr } = await supabaseClient.from("redemptions").select("*").order("id", { ascending: false });
      if (rErr) throw new Error("Could not load redemptions. Check 'redemptions' table: " + rErr.message);
      redemptions = rData || [];

      // Safe defaults
      if (selectedKidId === 'parents' && !parentUnlocked && kids.length > 0) {
        selectedKidId = kids[0].id;
      }
      if (!parentManageTab && kids.length > 0) {
        parentManageTab = kids[0].id;
      }
      
      renderTabs();
      render();
    } catch (error) {
      document.getElementById("content").innerHTML = `
        <div style="color:var(--accent-red); padding:20px; text-align:center; background:#fef2f2; border:1px solid #fee2e2; border-radius:12px;">
          <h3 style="margin-top:0;">⚠️ Database Connection Issue</h3>
          <p style="font-size:0.95rem; margin-bottom:10px;">${error.message}</p>
          <p style="font-size:0.85rem; color:var(--text-muted);">Please check your Supabase API credentials, table configurations, or network connection.</p>
          <button class="btn btn-secondary" onclick="loadData()" style="margin-top:10px; font-size:0.85rem; padding:6px 12px;">🔄 Try Again</button>
        </div>
      `;
      console.error(error);
    }
  }

  function renderTabs() {
    let html = kids.map(k => {
      const avatar = k.avatar || '🌟';
      const isActive = selectedKidId === k.id;
      return `<button class="tab-btn ${isActive ? 'active' : ''}" onclick="selectTab(${k.id})">${avatar} ${k.name}</button>`;
    }).join('');
    
    html += `<button class="tab-btn parent-tab" onclick="selectTab('parents')">⚙️ Parents</button>`;
    document.getElementById("tabs-container").innerHTML = html;
  }

  function selectTab(id) {
    selectedKidId = id;
    kidViewMode = 'today'; 
    selectedTaskDate = getLocalTodayISO(); 
    editingPendingId = null;
    renderTabs();
    render();
  }

  function render() {
    if (selectedKidId === 'parents') renderParents();
    else renderKid();
  }

  // --- PIN PORTAL AUTHENTICATION ---
  function checkPin() {
    const pinInput = document.getElementById("pinInput");
    if (pinInput && pinInput.value === PARENT_PIN) {
      parentUnlocked = true;
      sessionStorage.setItem("parentUnlocked", "true");
      showAlert("🔓 Parent Portal Unlocked", "success");
      render();
    } else {
      showAlert("❌ Incorrect PIN. Please try again.", "error");
    }
  }

  function lockParent() {
    parentUnlocked = false;
    sessionStorage.removeItem("parentUnlocked");
    showAlert("🔒 Parent Portal locked", "info");
    render();
  }

  // --- CONFIGURATION SAVE CHANNELS ---
  function saveThresholdSettings() {
    const threshVal = document.getElementById("settingsThreshold").value;
    const rateVal = document.getElementById("settingsRate").value;
    
    const parsedThresh = parseInt(threshVal, 10);
    const parsedRate = parseInt(rateVal, 10);
    
    if (isNaN(parsedThresh) || parsedThresh <= 0 || isNaN(parsedRate) || parsedRate <= 0) {
      return showAlert("⚠️ Please enter valid positive values for custom settings!", "error");
    }
    
    localStorage.setItem("redeem_threshold", parsedThresh);
    localStorage.setItem("exchange_rate", parsedRate);
    showAlert("⚙️ Settings updated successfully!", "success");
    render();
  }

  // --- SEPARATE CARD BUILDERS TO PREVENT NESTING STRING ERROR ---
  function generatePendingCardsHtml(pendingRequests) {
    if (!pendingRequests || pendingRequests.length === 0) return '';
    const exchangeRate = getExchangeRate();
    
    return pendingRequests.map(r => {
      const kid = kids.find(k => k.id === r.kid_id);
      const kidName = kid ? kid.name : "Unknown Kid";
      const logDateFmt = formatDate(r.log_date);
      const isEditing = (editingPendingId === r.id);

      // Convert names for readable pills
      let taskItemsHtml = '';
      let namesString = '';
      if (r.chore_ids && Array.isArray(r.chore_ids) && r.chore_ids.length > 0) {
        const names = r.chore_ids.map(cid => {
          const c = chores.find(item => item.id == cid);
          return c ? c.name : null;
        }).filter(Boolean);
        if (names.length > 0) {
          taskItemsHtml = `<div style="margin: 6px 0 8px 0;">${names.map(t => `<span class="task-pill">${t}</span>`).join('')}</div>`;
          namesString = names.join(', ');
        }
      }
      const encodedNames = encodeURIComponent(namesString);

      // Option A: Redemptions
      if (r.status === 'pending_redeem') {
        const calculatedCash = (r.total_points / exchangeRate).toFixed(2);
        return `
          <div class="card" style="margin-bottom: 10px; background: white; border-left-color: var(--accent-gold); flex-direction: column; align-items: stretch; gap: 10px;">
            <div>
              <strong style="font-size:1rem;">🎁 Apple Cash Cash-Out Request</strong><br>
              <strong>${kidName}</strong> (<small style="color:var(--text-muted)">${logDateFmt}</small>)<br> 
              Wants to redeem <strong style="color:var(--accent-gold)">${r.total_points} pts</strong> for <strong>$${calculatedCash} Apple Cash</strong>.
            </div>
            <div style="display: flex; gap: 10px;">
              <button class="btn btn-primary" style="background: var(--accent-gold); flex: 1; padding: 8px;" onclick="approveRedeem(${r.id}, ${r.kid_id}, ${r.total_points}, '${r.log_date}')">Approve Redeem</button>
              <button class="btn btn-danger" style="flex: 1; padding: 8px;" onclick="declineRequest(${r.id})">Decline</button>
            </div>
          </div>
        `;
      } 

      // Option B: Regular Chores/Penalties (Inline Parent Editor Interface)
      if (isEditing) {
        return `
          <div class="card" style="margin-bottom: 10px; background: #f8fafc; border-left-color: var(--accent-blue); flex-direction: column; align-items: stretch; gap: 12px; border: 1.5px dashed var(--accent-blue);">
            <div>
              <strong style="color:var(--accent-blue);">✏️ Editing ${kidName}'s Chore Request</strong>
            </div>
            <div>
              <label style="font-size:0.8rem; font-weight:700; color:var(--text-muted); display:block; margin-bottom:4px;">Chore Notes / Details:</label>
              <input id="editPendingNotes_${r.id}" value="${r.notes || namesString}" style="margin-bottom:8px;">
              
              <label style="font-size:0.8rem; font-weight:700; color:var(--text-muted); display:block; margin-bottom:4px;">Points Total:</label>
              <input id="editPendingPoints_${r.id}" type="number" value="${r.total_points}" style="width:120px; margin-bottom:4px;">
            </div>
            <div style="display: flex; gap: 8px;">
              <button class="btn btn-primary" style="background:var(--accent-green); flex: 1; padding: 8px;" onclick="savePendingEdit(${r.id}, ${r.kid_id}, '${r.log_date}')">💾 Save & Bank</button>
              <button class="btn btn-secondary" style="flex: 1; padding: 8px;" onclick="cancelPendingEdit()">❌ Cancel</button>
            </div>
          </div>
        `;
      } else {
        const ptsLabel = r.total_points >= 0 ? '+' + r.total_points : r.total_points;
        const ptsColor = r.total_points >= 0 ? 'var(--accent-green)' : 'var(--accent-red)';
        const displayNotes = r.notes || namesString;
        
        return `
          <div class="card" style="margin-bottom: 10px; background: white; border-left-color: ${ptsColor}; flex-direction: column; align-items: stretch; gap: 10px;">
            <div>
              <strong style="font-size:1rem;">${kidName}</strong> (<small style="color:var(--text-muted)">${logDateFmt}</small>)<br> 
              Requesting: <strong style="color: ${ptsColor}">${ptsLabel} pts</strong>
              ${taskItemsHtml}
              ${r.notes ? `<div style="font-size:0.85rem; color:var(--text-muted); margin-top:4px;">📝 <i>"${r.notes}"</i></div>` : ''}
            </div>
            <div style="display: flex; gap: 8px;">
              <button class="btn btn-primary" style="background: var(--accent-green); flex: 1.5; padding: 8px;" onclick="approve(${r.id}, ${r.kid_id}, ${r.total_points}, '${r.log_date}', '${encodedNames}', '${encodeURIComponent(displayNotes)}')">Approve & Bank</button>
              <button class="btn btn-secondary" style="flex: 1; padding: 8px;" onclick="startPendingEdit(${r.id})">✏️ Edit</button>
              <button class="btn btn-danger" style="flex: 1; padding: 8px;" onclick="declineRequest(${r.id})">Decline</button>
            </div>
          </div>
        `;
      }
    }).join('');
  }

  // --- PARENT PORTAL RENDER ---
  async function renderParents() {
    if (!parentUnlocked) {
      document.getElementById("content").innerHTML = `
        <div style="text-align:center; padding: 40px 20px;">
          <h2 style="margin-top:0;">🔒 Parent Portal</h2>
          <p style="color:var(--text-muted); margin-bottom:20px;">Enter PIN to access parent settings.</p>
          <div style="max-width:280px; margin:0 auto; display:flex; flex-direction:column; gap:12px;">
            <input type="password" id="pinInput" placeholder="Enter PIN" style="text-align:center; font-size:1.2rem; letter-spacing:4px;" onkeyup="if(event.key==='Enter') checkPin()">
            <button class="btn btn-primary" onclick="checkPin()">🔓 Unlock</button>
          </div>
        </div>
      `;
      return;
    }

    // Load pending
    const { data: pending, error: pErr } = await supabaseClient
      .from("pending_requests")
      .select("*")
      .in("status", ["pending", "pending_redeem"]);

    const currentThreshold = getRedeemThreshold();
    const currentExchangeRate = getExchangeRate();

    let pendingWrapperHtml = '';
    if (pending && pending.length > 0) {
      pendingWrapperHtml = `
        <div class="score-banner" style="text-align: left; border-color: var(--accent-green); background: #ecfdf5;">
          <h3 style="margin-top:0; color: var(--accent-green); font-size:1.1rem;">✅ Pending Approvals</h3>
          ${generatePendingCardsHtml(pending)}
        </div>
      `;
    }

    let kidsSetupOptionsHtml = kids.map(k => `<option value="${k.id}">${k.name}</option>`).join("");
    let kidsManageTabsHtml = kids.map(k => `
      <button class="${parentManageTab === k.id ? 'active' : ''}" onclick="setParentManageTab(${k.id})">${k.name}</button>
    `).join('');

    let choreManagerCardsHtml = '';
    const activeManageChores = chores.filter(c => c.kid_id === parentManageTab);
    if (activeManageChores.length === 0) {
      choreManagerCardsHtml = `<p style="text-align:center; color:var(--text-muted); padding:10px;">No chores setup yet for this child.</p>`;
    } else {
      choreManagerCardsHtml = activeManageChores.map(chore => {
        const ptsLabel = chore.points >= 0 ? `+${chore.points}` : `${chore.points}`;
        const isPenalty = chore.points < 0;
        const isEditing = (editingChoreId === chore.id);

        if (isEditing) {
          return `
            <div class="card ${isPenalty ? 'penalty-card' : ''}" style="padding:10px 12px;">
              <div style="display:flex; gap:8px; align-items:center; width:100%; margin-right:8px;">
                <input id="editName_${chore.id}" value="${chore.name.replace(/"/g, '&quot;')}" style="flex:2; margin:0;" placeholder="Task Name">
                <input id="editPts_${chore.id}" type="number" value="${chore.points}" style="flex:1; max-width:80px; margin:0;" placeholder="Pts">
              </div>
              <div style="display:flex; gap:6px;">

  // --- KID VIEW RENDERS ---
  function updateTaskDate(val) { selectedTaskDate = val; }
  function setParentManageTab(id) { parentManageTab = id; editingChoreId = null; render(); }
  function setKidView(mode) { kidViewMode = mode; render(); }

  function renderKid() {
    const kid = kids.find(k => k.id === selectedKidId);
    if (!kid) return;
    const kidIndex = kids.findIndex(k => k.id === kid.id);
    const color = kidColors[Math.max(0, kidIndex) % kidColors.length];
    
    // Financial metrics
    const exchangeRate = getExchangeRate();
    const pts = logs.filter(l => l.kid_id === kid.id).reduce((sum, l) => sum + l.points, 0);
    const totalRedeemed = redemptions.filter(r => r.kid_id === kid.id).reduce((sum, r) => sum + r.points_spent, 0);
    const totalCashOut = redemptions.filter(r => r.kid_id === kid.id).reduce((sum, r) => sum + r.amount, 0);
    const available = pts - totalRedeemed;
    
    // Level System (XP)
    const ptsPerLevel = 150;
    const currentLevel = Math.max(1, Math.floor(pts / ptsPerLevel) + 1);
    const remainderXP = pts % ptsPerLevel;
    const xpPercent = Math.min(100, Math.round((remainderXP / ptsPerLevel) * 100));

    const pend = JSON.parse(localStorage.getItem(`pend_${selectedKidId}`) || "[]");
    const regularChores = chores.filter(c => c.kid_id == kid.id && c.points >= 0);
    const penalties = chores.filter(c => c.kid_id == kid.id && c.points < 0);

    let html = `
      <div class="score-banner" style="border-color: ${color}; background: linear-gradient(180deg, #ffffff 0%, #fafafa 100%);">
        <div style="display:flex; justify-content:center; align-items:center; gap:10px; margin-bottom:4px;">
          <span style="font-size:2rem;">${kid.avatar || '🌟'}</span>
          <h2 style="margin:0; color: ${color}; font-size:1.6rem; font-weight:800;">${kid.name}</h2>
        </div>
        
        <div style="font-weight:700; color:var(--text-muted); font-size:0.9rem;">
          Level ${currentLevel} Hero
        </div>
        
        <div class="xp-bar-container">
          <div class="xp-bar-fill" style="width: ${xpPercent}%;"></div>
        </div>
        <div style="display:flex; justify-content:space-between; font-size:0.75rem; color:var(--text-muted); font-weight:700; margin-top:4px;">
          <span>${remainderXP} XP</span>
          <span>${ptsPerLevel - remainderXP} XP TO LEVEL UP!</span>
        </div>

        <div class="stats-row">
          <div class="stat-box">
            <div class="stat-value" style="color: var(--accent-green)">💰 ${available}</div>
            <div class="stat-label">Available</div>
          </div>
          <div class="stat-box">
            <div class="stat-value" style="color: ${color}">🏆 ${pts}</div>
            <div class="stat-label">Total Earned</div>
          </div>
          <div class="stat-box">
            <div class="stat-value" style="color: var(--accent-blue)">💵 $${totalCashOut.toFixed(2)}</div>
            <div class="stat-label">Cash Out</div>
          </div>
        </div>
      </div>
      
      <div class="kid-subtabs">
        <button class="${kidViewMode === 'today' ? 'active' : ''}" onclick="setKidView('today')">📋 Daily Chores</button>
        <button class="${kidViewMode === 'history' ? 'active' : ''}" onclick="setKidView('history')">📜 History & Rewards</button>
      </div>
    `;

    if (kidViewMode === 'today') {
      html += `
        <div style="display:flex; gap:10px; margin-top:15px; margin-bottom:15px; align-items:center;">
          <input type="date" id="taskDate" value="${selectedTaskDate}" onchange="updateTaskDate(this.value)" style="flex:2; margin:0; padding:10px 12px; font-weight:600;">
          <button class="btn btn-danger" style="flex:1; padding:11px;" onclick="resetToggles()">🔄 Reset</button>
          <button class="btn btn-primary" style="flex:1.5; padding:11px; background:#10b981;" onclick="send()">🚀 Send</button>
        </div>
      `;

      html += `<div class="section-title">✨ DAILY CHORES</div>`;
      if(regularChores.length === 0) {
        html += `<p style="font-size:0.9rem; color:#666; text-align:center; padding:10px;">No chores assigned yet.</p>`;
      } else {
        html += regularChores.map(c => `
          <div class="card">
            <div class="chore-info">
              <span>${c.name}</span>
              <span class="pts-badge">+${c.points} pts</span>
            </div>
            <label class="switch">
              <input type="checkbox" ${pend.includes(c.id)?'checked':''} onchange="toggle(${c.id})">
              <span class="slider"></span>
            </label>
          </div>
        `).join('');
      }
        
      if (penalties.length > 0) {
        html += `<div class="section-title" style="color:var(--accent-red);">⚠️ PENALTIES & BEHAVIOR</div>`;
        html += penalties.map(c => `
          <div class="card penalty-card">
            <div class="chore-info">
              <span>${c.name}</span>
              <span class="pts-badge penalty">${c.points} pts</span>
            </div>
            <label class="switch">
              <input type="checkbox" ${pend.includes(c.id)?'checked':''} onchange="toggle(${c.id})">
              <span class="slider penalty"></span>
            </label>
          </div>
        `).join('');
      }
    } else {
      html += renderKidHistory(kid.id);

    document.getElementById("content").innerHTML = html;

  // --- SEPARATE BUILDER FOR LEDGER CARD LISTS ---
  function generateActivityHistoryHtml(activityList) {
    if (!activityList || activityList.length === 0) {
      return `<p style="font-size:0.85rem; color:var(--text-muted); text-align:center; padding:12px;">No activity logged over the past 7 days.</p>`;
    }

    return activityList.map(item => {
      const ptsClass = item.points >= 0 ? 'var(--accent-green)' : 'var(--accent-red)';
      const ptsSign = item.points >= 0 ? `+${item.points}` : `${item.points}`;
      
      return `
        <div class="card" style="border-left-color: ${ptsClass};">
          <div>
            <strong style="font-size:0.95rem;">${item.title}</strong><br>
            <small style="color:var(--text-muted);">${item.displayDate}</small>
          </div>
          <strong style="color:${ptsClass}; font-size:1rem;">${ptsSign} pts</strong>
        </div>
      `;
    }).join('');
  }

  // --- 1-WEEK HISTORY & REWARDS VIEW ---
  function renderKidHistory(kidId) {
    const kidLogs = logs.filter(l => l.kid_id === kidId);
    const kidReds = redemptions.filter(r => r.kid_id === kidId);
    const totalEarned = kidLogs.reduce((sum, l) => sum + l.points, 0);
    const totalSpent = kidReds.reduce((sum, r) => sum + r.points_spent, 0);
    const available = totalEarned - totalSpent;
    
    // Dynamic settings
    const redeemThreshold = getRedeemThreshold();
    const exchangeRate = getExchangeRate();
    const calculatedCashValue = (redeemThreshold / exchangeRate).toFixed(2);

    let html = `
      <div class="score-banner" style="background:#f8fafc; border-color:var(--border);">
        <h3 style="margin:0 0 5px 0; color:var(--text); font-weight:700;">Available Balance</h3>
        <div style="font-size:2.2rem; font-weight:800; color:var(--accent-blue);">${available} pts</div>
        <p style="font-size:0.85rem; color:var(--text-muted); margin:6px 0 0 0; font-weight:600;">
          Total Earned: ${totalEarned} | Redeemed: ${totalSpent}
        </p>
      </div>
    `;

    html += `<div style="text-align: center; margin: 20px 0;">`;
    if (available >= redeemThreshold) {
      html += `
        <button class="btn btn-primary" style="background: var(--accent-gold); color: white; padding: 14px 20px; font-size: 1.05rem; width:100%; box-shadow:0 4px 10px rgba(245, 158, 11, 0.25);" onclick="requestRedeem(${kidId})">
          🎁 Request $${calculatedCashValue} Apple Cash (${redeemThreshold} pts)
        </button>
      `;
    } else {
      const needed = redeemThreshold - available;
      const progressPercent = Math.min(100, Math.round((available / redeemThreshold) * 100));
      
      html += `
        <div style="background:#fffbeb; padding:14px; border-radius:12px; border:1px solid #fef3c7; color:#b45309; font-weight:700; font-size:0.9rem;">
          <div style="margin-bottom:8px;">Earn ${needed} more points to redeem $${calculatedCashValue} Apple Cash!</div>
          <div style="background:#fef3c7; border-radius:10px; height:8px; overflow:hidden; width:100%;">
            <div style="background:var(--accent-gold); width:${progressPercent}%; height:100%;"></div>
          </div>
        </div>
      `;
    }
    html += `</div>`;

    // Filter events for the last 7 days
    const sevenDaysAgo = new Date();
    sevenDaysAgo.setDate(sevenDaysAgo.getDate() - 7);
    sevenDaysAgo.setHours(0, 0, 0, 0);
    const activityList = [];

    kidLogs.forEach(l => {
      const itemDate = l.created_at ? new Date(l.created_at) : parseLocalDate(l.log_date);
      if (itemDate >= sevenDaysAgo) {
        activityList.push({
          id: l.id,
          type: 'log',
          title: l.notes || (l.points >= 0 ? 'Completed Chores' : 'Manual Point Deduction'),
          points: l.points,
          displayDate: formatDate(l.log_date || l.created_at),
          timestamp: itemDate.getTime()
        });
      }
    });

    kidReds.forEach(r => {
      const itemDate = r.created_at ? new Date(r.created_at) : parseLocalDate(r.redeem_date);
      if (itemDate >= sevenDaysAgo) {
        activityList.push({
          id: r.id,
          type: 'redemption',
          title: `$${r.amount.toFixed(2)} Apple Cash Redemption`,
          points: -r.points_spent,
          displayDate: formatDate(r.redeem_date || r.created_at),
          timestamp: itemDate.getTime()
        });
      }
    });

    // Sort newest first
    activityList.sort((a, b) => b.timestamp - a.timestamp);

    html += `<div class="section-title">📅 7-DAY ACTIVITY HISTORY</div>`;
    html += generateActivityHistoryHtml(activityList);
    
    return html;
  }

  // --- INTERACTIVE ACTIONS ---
  function toggle(id) {
    let p = JSON.parse(localStorage.getItem(`pend_${selectedKidId}`) || "[]");
    if (p.includes(id)) {
      p = p.filter(i => i !== id);
    } else {
      p.push(id);
    }
    localStorage.setItem(`pend_${selectedKidId}`, JSON.stringify(p));
    render(); 
  }

  function resetToggles() {
    localStorage.removeItem(`pend_${selectedKidId}`);
    render();
  }

  async function send() {
    const p = JSON.parse(localStorage.getItem(`pend_${selectedKidId}`) || "[]");
    if (p.length === 0) return showAlert("⚠️ Please select at least one task or penalty before sending!", "error");
    
    const selectedChores = p.map(id => chores.find(item => item.id == id)).filter(Boolean);
    const total = selectedChores.reduce((sum, c) => sum + c.points, 0);
    
    // Save readable list
    const logNotes = selectedChores.map(c => c.name).join(", ");

    const { error } = await supabaseClient.from("pending_requests").insert({ 
      kid_id: selectedKidId, 
      chore_ids: p, 
      total_points: total, 
      log_date: selectedTaskDate, 
      notes: logNotes,
      status: 'pending'
    });

    if (error) {
      console.error(error);
      return showAlert("❌ Failed to send request: " + error.message, "error");
    }
    
    localStorage.removeItem(`pend_${selectedKidId}`);
    showAlert("🚀 Request successfully sent to Parents!", "success"); 
    
    // Confetti effect
    confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
    await loadData();
  }

  async function requestRedeem(kidId) {
    const redeemThreshold = getRedeemThreshold();
    const exchangeRate = getExchangeRate();
    const calculatedCashValue = (redeemThreshold / exchangeRate).toFixed(2);

    if(!confirm(`Are you sure you want to request $${calculatedCashValue} for ${redeemThreshold} points?`)) return;
    const today = getLocalTodayISO();

    const { error } = await supabaseClient.from("pending_requests").insert({ 
      kid_id: kidId, 
      chore_ids: [], 
      total_points: redeemThreshold, 
      log_date: today, 
      status: 'pending_redeem'
    });

    if (error) return showAlert("❌ Failed to send request: " + error.message, "error");
    showAlert(`🎁 Apple Cash redemption request sent for $${calculatedCashValue}!`, "success");
    await loadData();
  }

  // --- PARENT APPROVAL EDITORS ---
  function startPendingEdit(id) {
    editingPendingId = id;
    render();
  }

  function cancelPendingEdit() {
    editingPendingId = null;
    render();
  }

  async function savePendingEdit(rid, kidId, originalDate) {
    const editNotesInput = document.getElementById(`editPendingNotes_${rid}`);
    const editPtsInput = document.getElementById(`editPendingPoints_${rid}`);
    
    if (!editNotesInput || !editPtsInput) return;
    
    const newNotes = editNotesInput.value.trim();
    const newPts = parseInt(editPtsInput.value, 10);
    
    if (isNaN(newPts)) return showAlert("⚠️ Points must be a valid number", "error");

    // Approve edited items
    const payload = { 
      kid_id: kidId, 
      points: newPts, 
      log_date: originalDate, 
      notes: newNotes || "Edited Chores Log" 
    };
    
    const { error: logError } = await supabaseClient.from("task_logs").insert(payload);
    if (logError) return showAlert("❌ Failed to log approved chores: " + logError.message, "error");

    // Close request
    await supabaseClient.from("pending_requests").update({ status: 'banked' }).eq('id', rid);
    
    editingPendingId = null;
    showAlert("🎉 Custom points approved and banked successfully!", "success");
    
    confetti({ particleCount: 50, spread: 60, colors: ['#10b981', '#3b82f6'] });
    await loadData();
  }

  async function approve(rid, kidId, pts, originalDate, encodedChoreNames = "", defaultNotes = "") {
    let choreNames = decodeURIComponent(encodedChoreNames);
    let rawNotes = decodeURIComponent(defaultNotes);
    const payload = { kid_id: kidId, points: pts, log_date: originalDate };
    
    if (rawNotes && rawNotes.trim() !== "") {
      payload.notes = rawNotes;
    } else if (choreNames && choreNames.trim() !== "") {
      payload.notes = choreNames;
    }
    
    const { error } = await supabaseClient.from("task_logs").insert(payload);
    if (error) {
      return showAlert("❌ Failed to approve: " + error.message, "error");
    }
    await supabaseClient.from("pending_requests").update({ status: 'banked' }).eq('id', rid);
    showAlert("🎉 Points successfully banked!", "success");
    
    confetti({ particleCount: 60, spread: 80 });
    await loadData();
  }

  async function approveRedeem(rid, kidId, pts, originalDate) {
    const exchangeRate = getExchangeRate();
    const amount = pts / exchangeRate;

    await supabaseClient.from("redemptions").insert({ 
      kid_id: kidId, 
      amount: amount, 
      points_spent: pts, 
      redeem_date: originalDate 
    });

    await supabaseClient.from("pending_requests").update({ status: 'banked' }).eq('id', rid);
    showAlert(`💵 Approved: $${amount.toFixed(2)} Apple Cash has been redeemed!`, "success");
    
    confetti({ particleCount: 80, spread: 90, colors: ['#f59e0b', '#10b981'] });
    await loadData();
  }

  async function declineRequest(rid) {
    const { error } = await supabaseClient.from("pending_requests").update({ status: 'declined' }).eq('id', rid);
    if (error) showAlert("❌ Failed to decline: " + error.message, "error");
    else {
      showAlert("🚫 Request declined successfully", "info");
      await loadData();
    }
  }

  // --- KID AND ACTION CREATOR FUNCTIONS ---
  async function addKid() {
    const name = document.getElementById("kidName").value.trim();
    const avatar = document.getElementById("kidAvatarSelect").value;
    if (!name) return showAlert("⚠️ Please enter a name", "error");
    
    // Add columns dynamically handled. We try custom avatar first, catch if DB column missing
    const { error } = await supabaseClient.from("kids").insert({ name: name, avatar: avatar });
    if (error) {
      // Graceful fallback if user hasn't added column yet
      const { error: fallbackError } = await supabaseClient.from("kids").insert({ name: name });
      if (fallbackError) return showAlert("❌ Failed to add kid: " + fallbackError.message, "error");
    }
    
    showAlert(`✨ Added ${name}!`, "success");
    await loadData();
  }

  async function addBulkChores() {
    const kidId = document.getElementById("choreKid").value;
    const list = document.getElementById("choreList").value;
    if (!kidId || !list.trim()) return showAlert("⚠️ Missing kid or chores list", "error");
    
    const lines = list.split('\n');
    const inserts = [];
    for (let line of lines) {
      if (!line.trim()) continue;
      const parts = line.split(',');
      if (parts.length >= 2) {
        const name = parts[0].trim();
        const pts = parseInt(parts[1].trim(), 10);
        if (!isNaN(pts)) inserts.push({ kid_id: kidId, name: name, points: pts });
      }
    }
    
    if (inserts.length > 0) {
      await supabaseClient.from("chores").insert(inserts);
      showAlert("✅ Actions added successfully!", "success");
      await loadData();
    } else {
      showAlert("⚠️ Could not parse actions. Format: 'Name, Points'", "error");
    }
  }

  async function adjustPoints() {
    const kidId = document.getElementById("adjustKid").value;
    const pts = parseInt(document.getElementById("adjustPoints").value, 10);
    const note = document.getElementById("adjustNote").value.trim();
    if (!kidId || isNaN(pts)) return showAlert("⚠️ Invalid kid or points amount", "error");
    if (!note) return showAlert("⚠️ A note/comment is required for manual adjustments!", "error");
    
    const today = getLocalTodayISO();
    const { error } = await supabaseClient.from("task_logs").insert({ 
      kid_id: kidId, 
      points: pts, 
      notes: note,
      log_date: today 
    });
    if (error) return showAlert("❌ Adjustment failed: " + error.message, "error");
    showAlert("✅ Manual adjustment applied!", "success");
    await loadData();
  }

  // --- INLINE ACTION EDITOR ---
  function startInlineEdit(id) { editingChoreId = id; render(); }
  function cancelInlineEdit() { editingChoreId = null; render(); }
  
  async function saveInlineEdit(id) {
    const nameInput = document.getElementById(`editName_${id}`);
    const ptsInput = document.getElementById(`editPts_${id}`);
    if (!nameInput || !ptsInput) return;
    const newName = nameInput.value.trim();
    const newPts = parseInt(ptsInput.value, 10);
    if (!newName || isNaN(newPts)) return showAlert("⚠️ Invalid values", "error");
    
    await supabaseClient.from("chores").update({ name: newName, points: newPts }).eq("id", id);
    editingChoreId = null;
    showAlert("✏️ Action updated successfully!", "success");
    await loadData();
  }

  async function deleteChore(id) {
    if(confirm("Are you sure you want to delete this action?")) {
      await supabaseClient.from("chores").delete().eq("id", id);
      showAlert("Action deleted", "info");
      await loadData();
    }
  }
</script>
</body>
